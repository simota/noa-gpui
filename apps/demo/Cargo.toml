[package]
name = "demo"
description = "The noa-gpui demo screens shared by the desktop and web apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
native = ["ui-platform/native"]
webgpu = ["ui-platform/webgpu"]
webgl2 = ["ui-platform/webgl2"]

[dependencies]
ui-platform.workspace = true
ui-scene.workspace = true
ui-core.workspace = true
ui-text.workspace = true
ui-render-wgpu.workspace = true
log.workspace = true
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }
