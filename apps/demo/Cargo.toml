[package]
name = "demo"
description = "The noa-gpui demo screens shared by the desktop and web apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
native = ["noa-gpui-platform/native"]
webgpu = ["noa-gpui-platform/webgpu"]
webgl2 = ["noa-gpui-platform/webgl2"]

[dependencies]
noa-gpui-platform.workspace = true
noa-gpui-scene.workspace = true
noa-gpui-core.workspace = true
noa-gpui-text.workspace = true
noa-gpui-render-wgpu.workspace = true
log.workspace = true
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }
