[package]
name = "noa-gpui-render-wgpu"
description = "wgpu renderer for the noa-gpui display list"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
native = ["wgpu/dx12", "wgpu/metal", "wgpu/vulkan", "wgpu/gles"]
webgpu = ["wgpu/webgpu"]
webgl2 = ["wgpu/webgl"]

[dependencies]
noa-gpui-scene.workspace = true
noa-gpui-text.workspace = true
wgpu.workspace = true
glyphon.workspace = true
bytemuck.workspace = true
log.workspace = true

[dev-dependencies]
pollster.workspace = true

[[test]]
name = "render"
required-features = ["native"]

[[bench]]
name = "gpu_frame"
harness = false
required-features = ["native"]
