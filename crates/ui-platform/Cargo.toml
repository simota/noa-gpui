[package]
name = "noa-gpui-platform"
description = "winit application shell for noa-gpui: windows, input, the frame loop and OS integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
native = [
    "noa-gpui-render-wgpu/native",
    "dep:arboard",
    "dep:accesskit_winit",
    "dep:tray-icon",
    "dep:rfd",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:ksni",
]
# Native web views on Linux (WebKitGTK, X11 only). Needs the webkit2gtk-4.1 and GTK 3
# development libraries, so `native` leaves it out: without it, `WebView` widgets show
# their placeholder on Linux.
webview-linux = ["native", "dep:wry", "wry/os-webview", "wry/x11", "dep:gtk"]
webgpu = ["noa-gpui-render-wgpu/webgpu"]
webgl2 = ["noa-gpui-render-wgpu/webgl2"]

[dependencies]
noa-gpui-scene.workspace = true
noa-gpui-core.workspace = true
noa-gpui-text.workspace = true
noa-gpui-render-wgpu.workspace = true
winit.workspace = true
log.workspace = true
web-time.workspace = true
arboard = { workspace = true, optional = true }
accesskit_winit = { workspace = true, optional = true }

# Blocks on GPU initialization (the Web awaits it before the app starts).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

# The system menu bar (macOS, through tray-icon's `menu`, which is muda) and menu bar
# extras / tray icons (macOS, Windows).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { workspace = true, optional = true }

# Native views for `WebView` widgets (WKWebView on macOS, WebView2 on Windows), used
# with `native`. Not optional here: an optional `wry` would be turned on by the same
# feature on Linux too, where it needs WebKitGTK (see `webview-linux`), and Cargo does not
# allow the crate a second name.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies.wry]
workspace = true

# The application delegate that reports a click on the Dock icon (reopen).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true }

# The OS's open and save panels (NSOpenPanel / NSSavePanel on macOS, the common item
# dialogs on Windows, the XDG desktop portal on Linux).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies.rfd]
workspace = true
optional = true

# The tray icon on Linux (StatusNotifierItem over D-Bus, no GTK).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies.rfd]
workspace = true
optional = true
features = ["xdg-portal", "async-std"]

# Native views for `WebView` widgets on Linux (WebKitGTK), only with `webview-linux`.
[target.'cfg(target_os = "linux")'.dependencies.wry]
workspace = true
optional = true

# WebKitGTK needs GTK initialized (gtk-rs's `gtk::init`, which wry's views check) and its
# main loop run alongside winit's. The version wry depends on.
[target.'cfg(target_os = "linux")'.dependencies.gtk]
version = "0.18.2"
optional = true

# The hidden text area for keyboard and IME input on the Web (`web_ime`), the
# accessibility tree mirrored as ARIA elements (`web_a11y`), and the `<iframe>`s of
# `WebView` widgets (`webview_web`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "HtmlCanvasElement",
    "Window",
    "Navigator",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlTextAreaElement",
    "CssStyleDeclaration",
    "DomRect",
    "FocusOptions",
    "Node",
    "EventTarget",
    "Event",
    "KeyboardEvent",
    "InputEvent",
    "CompositionEvent",
    "UiEvent",
    "Text",
    "CharacterData",
    "HtmlIFrameElement",
    "Location",
    "History",
] }

[[example]]
name = "hello"
required-features = ["native"]

[[example]]
name = "snapshot"
required-features = ["native"]
