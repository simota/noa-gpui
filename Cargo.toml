[workspace]
resolver = "3"
members = [
    "crates/ui-scene",
    "crates/ui-text",
    "crates/ui-layout",
    "crates/ui-core",
    "crates/ui-render-wgpu",
    "crates/ui-platform",
    "apps/demo",
    "apps/desktop",
    "apps/web",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/simota/noa-gpui"

[workspace.dependencies]
noa-gpui-scene = { path = "crates/ui-scene", version = "0.2.0" }
noa-gpui-text = { path = "crates/ui-text", version = "0.2.0" }
noa-gpui-layout = { path = "crates/ui-layout", version = "0.2.0" }
noa-gpui-core = { path = "crates/ui-core", version = "0.2.0" }
noa-gpui-render-wgpu = { path = "crates/ui-render-wgpu", version = "0.2.0" }
noa-gpui-platform = { path = "crates/ui-platform", version = "0.2.0" }
demo = { path = "apps/demo" }

wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
glyphon = "0.12.0"
cosmic-text = "0.19.0"
taffy = "0.15.1"
unicode-segmentation = "1.13"
regex = { version = "1.13", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
sys-locale = "0.3.2"
winit = "0.30.13"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1.0.1"
log = "0.4"
env_logger = "0.11"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
console_error_panic_hook = "0.1.7"
console_log = "1"
web-time = "1"
arboard = { version = "3.7.0", default-features = false }
accesskit = "0.25.2"
tray-icon = { version = "0.25.1", default-features = false }
rfd = { version = "0.16.0", default-features = false }
objc2 = "0.6.5"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
accesskit_winit = { version = "0.34.2", default-features = false, features = ["accesskit_unix", "async-io", "rwh_06"] }
# The OS's web view (WKWebView, WebView2, WebKitGTK) for `WebView` widgets. Its default
# features pull in WebKitGTK on Linux, which only `noa-gpui-platform/webview-linux` wants.
wry = { version = "0.57.3", default-features = false }

[profile.release]
debug = "line-tables-only"

# Web builds: no debug info, size-oriented whole-program optimization for a smaller
# .wasm (it is downloaded before anything shows).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
debug = false
lto = true
codegen-units = 1
